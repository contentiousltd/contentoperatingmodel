name: Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, build and validate
    runs-on: ubuntu-latest
    env:
      # Em dashes fail the build; the heuristic prose rules stay advisory.
      STRICT_PROSE_RULES: em-dash
    steps:
      - uses: actions/checkout@v4
        with:
          # sitemap-lastmod.mjs reads each page's last commit date, which a
          # depth-1 clone does not have. Without this every lastmod is omitted
          # and the sitemap silently loses the field.
          fetch-depth: 0
          # persist-credentials: false stops actions/checkout writing an
          # AUTHORIZATION header for github.com into git config, which would
          # override the credentials the private-packages step below
          # configures. These jobs never push, so they do not need it.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # @contentious/ui is private now (it carries the licensed Bely fonts), so
      # npm needs the suite's read-only package token to clone it; see the
      # meta-repo's docs/plans/private-contentious-ui-access.md. Without the
      # secret this does nothing and npm ci fails loudly on the package.
      - name: Authenticate for private @contentious packages
        env:
          CONTENTIOUS_PACKAGES_TOKEN: ${{ secrets.CONTENTIOUS_PACKAGES_TOKEN }}
        run: |
          if [ -n "$CONTENTIOUS_PACKAGES_TOKEN" ]; then
            for u in "https://github.com/" "ssh://git@github.com/" "git@github.com:"; do
              git config --global --add url."https://$CONTENTIOUS_PACKAGES_TOKEN@github.com/".insteadOf "$u"
            done
          fi

      - run: npm ci

      # Type-check, prose and tokens. check:tokens is the local stand-in for the
      # token-copy detector suite ADR-0011 §5 promises the package will ship.
      - run: npm run lint

      # The design system is pinned by exact tag (suite ADR-0014 §2). A
      # consumer may be deliberately behind, never silently behind.
      - run: npm run check:ui-current

      # Build runs the postbuild validator: every page needs a description, a
      # canonical, JSON-LD, a Markdown twin and no trailing-slash internal
      # links, and llms.txt, the sitemap, robots.txt and the feed must exist.
      - run: npm run build
